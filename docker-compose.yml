version: '3.8'

volumes:
  n8n_storage:
  postgres_storage:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    networks: ['backend']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: >-
      postgres -c shared_buffers=128MB -c max_connections=50
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./database/init/pgvector.sql:/docker-entrypoint-initdb.d/pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: ['backend']
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    networks: ['backend','frontend']
    ports:
      - 5678:5678
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${JWT_SECRET}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n-import:/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2.7.6
    restart: unless-stopped
    networks: ['frontend']
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgrest:
    image: postgrest/postgrest:v11.2.2
    restart: unless-stopped
    networks: ['backend']
    environment:
      - PGRST_DB_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    # Only start if SUPABASE_URL is not set
    entrypoint: ["/bin/sh", "-c", "if [ -z \"$SUPABASE_URL\" ]; then exec postgrest; else sleep infinity; fi"]
